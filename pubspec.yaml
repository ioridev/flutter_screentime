name: flutter_screentime
description: Flutter plugin for Screen Time style blocking with host-configured iOS extensions and configurable Android overlays.
version: 0.1.0
homepage: https://github.com/ioridev/flutter_screentime
repository: https://github.com/ioridev/flutter_screentime
issue_tracker: https://github.com/ioridev/flutter_screentime/issues
documentation: https://github.com/ioridev/flutter_screentime/blob/main/README.md

environment:
  sdk: ^3.0.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.iori.flutter_screentime
        pluginClass: FlutterScreentimePlugin
      ios:
        pluginClass: FlutterScreentimePlugin
